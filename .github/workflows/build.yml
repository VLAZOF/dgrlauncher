name: Build and Release DgrLauncher

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.asset_os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_os: windows
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_os: linux

    steps:
      - uses: actions/checkout@v4

      # Системные зависимости для iced/winit/wgpu на Linux.
      - name: Install Linux dependencies
        if: matrix.asset_os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev \
            libx11-dev libxkbcommon-dev libwayland-dev \
            libgl1-mesa-dev libfontconfig1-dev libfreetype6-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Check tag matches Cargo version
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          TAG="${TAG#v}"
          VER=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\([^"]*\)".*/\1/')
          echo "Tag version: $TAG, Cargo version: $VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::warning::Tag v$TAG does not match Cargo.toml version $VER. The in-app updater compares semver, so bump Cargo.toml before tagging."
          fi

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # Имена ассетов важны: апдейтер в src/update_manager.rs ищет
      #   *windows*.zip  (внутри dgrlauncher.exe)
      #   *linux*.tar.gz (внутри dgrlauncher)
      # и распаковывает их в src/downloader.rs.
      - name: Package (Windows)
        if: matrix.asset_os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/dgrlauncher.exe" "dist/dgrlauncher.exe"
          Compress-Archive -Path "dist/dgrlauncher.exe" -DestinationPath "dist/dgrlauncher-windows-x86_64.zip" -Force
          Remove-Item "dist/dgrlauncher.exe"
          Get-ChildItem dist

      - name: Package (Linux)
        if: matrix.asset_os == 'linux'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/dgrlauncher" dist/dgrlauncher
          chmod +x dist/dgrlauncher
          tar -czf dist/dgrlauncher-linux-x86_64.tar.gz -C dist dgrlauncher
          rm dist/dgrlauncher
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dgrlauncher-${{ matrix.asset_os }}-x86_64
          path: dist/*

      # Оба matrix-джоба докачивают свой архив в один и тот же релиз по тегу.
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
