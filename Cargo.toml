[package]
name = "dgrlauncher"
version = "0.1.0"
edition = "2024"
authors = ["VLAZOF"]
repository = "https://github.com/VLAZOF/dgrlauncher"
build = "build.rs"

[profile.release]
strip = true
lto = true

[dependencies]
iced = { version = "0.14.0", features = ["tokio", "svg", "image"] }
reqwest = {version = "0.13.4", features = ["json"]}
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
open = "5.4.3"
zip = "8.6.0"
image = "0.25"
uuid = { version = "1.26.0", features = ["v4"] }
md5 = "0.8.1"
shared_child = "1.1.2"
tar = "0.4.46"
flate2 = "1.1.10"
tokio = { version = "1", features = ["time"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"
