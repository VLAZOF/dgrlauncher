[package]
name = "dgrlauncher"
version = "0.4.0"
edition = "2024"
authors = ["VLAZOF"]
repository = "https://github.com/VLAZOF/dgrlauncher"
build = "build.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[dependencies]
iced = { version = "0.14.0", features = ["tokio", "svg", "image"] }
iced_core = { version = "0.14.0" }
iced_runtime = { version = "0.14.0" }
sha2 = { version = "0.10", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
open = "5.4.4"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png"] }
uuid = { version = "1.26.1", default-features = false, features = ["v4", "std"] }
md5 = { version = "0.8.1", default-features = false }
shared_child = { version = "1.1.2", default-features = false }
tar = { version = "0.4.46", default-features = false }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
tokio = { version = "1", features = ["time", "process"] }
rust-i18n = "3"
sys-locale = "0.3"
rfd = "0.16"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"
